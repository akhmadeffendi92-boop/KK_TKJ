<header><h1>🛜 Belajar MikroTik dari Nol</h1>
<div class="mu">8 materi berurutan. Setiap materi punya lab Winbox yang bisa diklik. Selesaikan lab untuk membuka materi berikutnya.</div>
<div class="tabs"><button id="t1" class="chip on" onclick="setT(0)">📖 Materi Lengkap</button><button id="t2" class="chip" onclick="setT(1)">🧪 Lab Interaktif</button><button id="t3" class="chip" onclick="setT(2)">🌐 Topologi</button></div><div id="chips"></div></header>
<main id="app"></main>
<script>
var L=[
{t:"Pengenalan MikroTik & RouterOS",h:`<p><b>MikroTik</b> adalah produsen perangkat jaringan asal Latvia. Perangkatnya (RouterBOARD) menjalankan sistem operasi <b>RouterOS</b> yang bisa berfungsi sebagai router, firewall, hotspot, bandwidth manager, sampai VPN server.</p>
<h3>Cara mengakses router</h3><ul><li><b>Winbox:</b> aplikasi GUI (dipakai di lab ini).</li><li><b>WebFig:</b> lewat browser ke IP router.</li><li><b>CLI:</b> Terminal / SSH / Telnet.</li></ul>
<h3>Default RouterOS</h3><ul><li>IP: <code>192.168.88.1</code></li><li>User: <code>admin</code>, password: kosong</li></ul>
<h3>Topologi lab kita</h3><p>ISP (192.168.100.1) terhubung ke <b>ether1</b> router, lalu <b>ether2</b> ke jaringan lokal 192.168.10.0/24. Tujuan akhir: PC siswa bisa internetan lewat router MikroTik.</p>`,st:[]},
{t:"Login ke Winbox",h:`<p>Winbox bisa terhubung lewat IP address atau MAC address (berguna saat router belum punya IP / setelah reset).</p><ul><li>Connect To: alamat IP router</li><li>Login: <code>admin</code></li><li>Password: kosong (default)</li></ul><p>Pada router sungguhan, <b>segera ganti password</b> setelah login pertama (menu System ▸ Users).</p>`,st:[["Isi Connect To <code>192.168.88.1</code>, Login <code>admin</code>, Password dikosongkan, lalu klik Connect","f","login",["192.168.88.1","admin",""]]]},
{t:"Mengenal Interface",h:`<p>Interface adalah port fisik/virtual router. Menu <b>Interfaces</b> menampilkan daftarnya. Status <b>R</b> berarti <i>Running</i> (kabel terhubung).</p><ul><li><b>ether1</b> = WAN, ke ISP</li><li><b>ether2</b> = LAN, ke jaringan lokal</li></ul><p>Praktik terbaik: beri nama/comment jelas pada tiap port agar tidak tertukar.</p>`,st:[["Klik menu <b>Interfaces</b>","m","iface"],["Klik baris <b>ether1</b> (port ke ISP / WAN)","r","ether1"],["Klik baris <b>ether2</b> (port ke LAN)","r","ether2"]]},
{t:"Konfigurasi IP Address",h:`<p>Agar router bisa berkomunikasi, tiap interface butuh IP address (format CIDR, misal <code>/24</code> = 255.255.255.0).</p><pre>/ip address add address=192.168.100.2/24 interface=ether1
/ip address add address=192.168.10.1/24 interface=ether2</pre><p>ether1 satu jaringan dengan ISP (192.168.100.1). ether2 menjadi gateway untuk LAN.</p>`,st:[["Klik menu <b>IP ▸ Addresses</b>","m","addr"],["Klik tombol <b>+ Add</b>","b","add"],["Isi Address <code>192.168.100.2/24</code>, Interface <code>ether1</code>, klik OK","f","addr",["192.168.100.2/24","ether1"]],["Klik <b>+ Add</b> lagi","b","add"],["Isi Address <code>192.168.10.1/24</code>, Interface <code>ether2</code>, klik OK","f","addr",["192.168.10.1/24","ether2"]]]},
{t:"Routing (Default Route)",h:`<p>Router perlu tahu ke mana mengirim paket ke jaringan yang tidak dikenalnya. <b>Default route</b> <code>0.0.0.0/0</code> mengarahkan semua tujuan lain ke gateway ISP.</p><pre>/ip route add dst-address=0.0.0.0/0 gateway=192.168.100.1</pre>`,st:[["Klik menu <b>IP ▸ Routes</b>","m","route"],["Klik <b>+ Add</b>","b","add"],["Dst. Address <code>0.0.0.0/0</code>, Gateway <code>192.168.100.1</code>, klik OK","f","route",["0.0.0.0/0","192.168.100.1"]]]},
{t:"NAT & DNS",h:`<p>IP LAN (192.168.10.x) adalah IP private yang tidak bisa dipakai di internet. <b>NAT masquerade</b> menyamarkan IP LAN menjadi IP WAN router saat keluar.</p><pre>/ip firewall nat add chain=srcnat out-interface=ether1 action=masquerade
/ip dns set servers=8.8.8.8 allow-remote-requests=yes</pre><p><b>DNS</b> mengubah nama domain jadi IP, jadi router perlu server DNS.</p>`,st:[["Klik menu <b>IP ▸ Firewall ▸ NAT</b>","m","nat"],["Klik <b>+ Add</b>","b","add"],["Chain <code>srcnat</code>, Out. Interface <code>ether1</code>, Action <code>masquerade</code>, klik OK","f","nat",["srcnat","ether1","masquerade"]],["Klik menu <b>IP ▸ DNS</b>","m","dns"],["Isi Servers <code>8.8.8.8</code>, klik OK","f","dns",["8.8.8.8"]]]},
{t:"DHCP Server",h:`<p><b>DHCP</b> membagikan IP otomatis ke klien sehingga tidak perlu diatur manual satu-satu. Perlu: interface, rentang IP (pool), dan gateway.</p><pre>/ip pool add name=pool1 ranges=192.168.10.10-192.168.10.100
/ip dhcp-server add interface=ether2 address-pool=pool1</pre>`,st:[["Klik menu <b>IP ▸ DHCP Server</b>","m","dhcp"],["Klik <b>+ Add</b>","b","add"],["Interface <code>ether2</code>, Address Pool <code>192.168.10.10-192.168.10.100</code>, Gateway <code>192.168.10.1</code>, OK","f","dhcp",["ether2","192.168.10.10-192.168.10.100","192.168.10.1"]]]},
{t:"Uji Koneksi & Ringkasan",h:`<p>Terakhir, uji dengan <b>ping</b> dari router ke internet. Jika reply, berarti IP, route, NAT, dan DNS sudah benar.</p><h3>Ringkasan alur konfigurasi</h3><ul><li>1. Login Winbox</li><li>2. Cek interface</li><li>3. Set IP address (WAN &amp; LAN)</li><li>4. Default route ke ISP</li><li>5. NAT masquerade + DNS</li><li>6. DHCP server untuk LAN</li><li>7. Uji ping</li></ul><h3>Troubleshooting</h3><ul><li>Timeout? Cek IP, gateway, dan NAT satu per satu.</li><li>Ping IP berhasil tapi domain gagal? Masalah DNS.</li></ul>`,st:[["Klik menu <b>Tools ▸ Ping</b>","m","ping"],["Isi Ping To <code>8.8.8.8</code>, klik Start","f","ping",["8.8.8.8"]]]}
];
var P={login:{l:"WinBox Login",c:["Connect To","Login","Password"],set:"Connect",pw:2},
iface:{l:"Interfaces",c:["Name","Type","Status"],r:[["ether1","Ethernet","R"],["ether2","Ethernet","R"],["ether3","Ethernet","-"]],pick:1},
addr:{l:"IP ▸ Addresses",c:["Address","Interface"],o:{1:["ether1","ether2","ether3"]}},

function sub(id){var p=P[id],v=p.c.map(function(c,i){return document.getElementById("f"+i).value}),s=cur();
 if(s&&!(s[1]=="f"&&s[2]==id&&eq(s[3],v))){MSG="Nilai belum sesuai petunjuk langkah aktif. Periksa lagi isian dan menu yang dibuka.";R();return}
 if(id=="login")S.login=1;
 else if(id=="dns")S.d.dns=v[0];
 else if(id=="ping"){if(ok()){S.po="PING "+v[0]+"\n64 bytes from "+v[0]+" time=12ms\n64 bytes from "+v[0]+" time=11ms\n64 bytes from "+v[0]+" time=12ms\n3 sent, 3 received, 0% loss";S.pg=1}else{S.po="PING "+v[0]+"\nrequest timed out\nrequest timed out\n0% received. Cek IP, route, NAT, dan DNS.";MSG="Ping gagal. Konfigurasi belum lengkap.";R();return}}
 else{S.d[id].push(v);S.dlg=0}

function panel(){var id=S.login?S.m:"login";if(!id)return "<p class='mu'>Pilih menu di atas, sesuai langkah petunjuk.</p>";
 var p=P[id],h="<b>"+p.l+"</b>";

 if(!p.set){var rows=p.r||S.d[id];h+="<table><tr>"+p.c.map(function(c){return "<th>"+c+"</th>"}).join("")+"</tr>"+(rows.length?rows.map(function(r){return "<tr class='"+(p.pick?"rw ":"")+(S.sel==r[0]&&p.pick?"sel":"")+"' "+(p.pick?"onclick=\"pick('"+r[0]+"')\"":"")+">"+r.map(function(x){return "<td>"+x+"</td>"}).join("")+"</tr>"}).join(""):"<tr><td colspan="+p.c.length+" class='mu'>(kosong)</td></tr>")+"</table>"}

 if(id=="dns"&&S.d.dns)h+="<p class='mu'>DNS saat ini: "+S.d.dns+"</p>";
 if(id=="ping"&&S.po)h+="<pre>"+S.po+"</pre>";
 return h}
function topo(){var a=has("addr",["192.168.100.2/24","ether1"]),b=has("addr",["192.168.10.1/24","ether2"]),r=has("route",["0.0.0.0/0","192.168.100.1"]),n=has("nat",["srcnat","ether1","masquerade"]),dh=S.d.dhcp.length>0,c1=a&&r?"var(--ok)":"var(--bd)",c2=b?"var(--ok)":"var(--bd)";
 return "<svg viewBox='0 0 560 130' width='100%' role='img' aria-label='Topologi'><line x1='120' y1='55' x2='230' y2='55' stroke='"+c1+"' stroke-width='4'/><line x1='330' y1='55' x2='440' y2='55' stroke='"+c2+"' stroke-width='4'/><rect x='10' y='30' width='110' height='50' rx='10' fill='var(--hl)' stroke='var(--bd)'/><text x='65' y='52' text-anchor='middle'>ISP / Internet</text><text x='65' y='68' text-anchor='middle'>192.168.100.1</text><rect x='230' y='30' width='100' height='50' rx='10' fill='var(--pr)'/><text x='280' y='60' text-anchor='middle' style='fill:var(--pt);font-weight:700'>MikroTik</text><rect x='440' y='30' width='110' height='50' rx='10' fill='var(--hl)' stroke='var(--bd)'/><text x='495' y='52' text-anchor='middle'>PC Siswa</text><text x='495' y='68' text-anchor='middle'>"+(dh?"192.168.10.10 (DHCP)":"belum dapat IP")+"</text><text x='175' y='45' text-anchor='middle'>ether1</text><text x='385' y='45' text-anchor='middle'>ether2</text><text x='280' y='105' text-anchor='middle'>"+(a?"✔ IP WAN ":"")+(b?"✔ IP LAN ":"")+(r?"✔ Route ":"")+(n?"✔ NAT ":"")+(S.pg?"✔ Internet OK":"")+"</text></svg>"}
function R(){tabsUI();if(TAB==0){RM();return}if(TAB==2){RT();return}
 document.getElementById("chips").innerHTML=L.map(function(x,i){return "<button class='chip "+(i==S.li?"on":"")+"' "+(i>S.done?"disabled":"")+" onclick='openL("+i+")' title='"+x.t+"'>"+(i+1)+"</button>"}).join("")+"<button class='chip' onclick='reset()' title='Ulangi'>↺</button>";
 var l=L[S.li],h="<div class='card'><div class='mu'>Materi "+(S.li+1)+" dari "+L.length+"</div><h2>"+l.t+"</h2>"+l.h+"</div>";

  if(!s)h+="<div class='msg' style='border-color:var(--ok)'>✅ Lab selesai!"+(S.li<L.length-1?" Lanjut ke materi berikutnya.":" Selamat, semua materi tuntas! 🎉")+"</div>"+(S.li<L.length-1?"<div class='row'><button class='btn' onclick='nx()'>Materi berikutnya →</button></div>":"");
  h+="</div>"}

var MAT=[
{t:"Dasar Jaringan Komputer",h:`<p>Jaringan komputer adalah kumpulan perangkat yang saling terhubung untuk bertukar data. Sebelum belajar MikroTik, pahami istilah berikut:</p><ul><li><b>LAN</b> (Local Area Network): jaringan area lokal, misalnya lab sekolah.</li><li><b>WAN</b> (Wide Area Network): jaringan luas, contohnya internet dari ISP.</li><li><b>IP Address:</b> alamat logis perangkat (contoh <code>192.168.10.5</code>).</li><li><b>MAC Address:</b> alamat fisik unik kartu jaringan (contoh <code>AA:BB:CC:11:22:33</code>).</li><li><b>Gateway:</b> pintu keluar sebuah jaringan menuju jaringan lain, biasanya IP router.</li><li><b>Protokol &amp; Port:</b> aturan komunikasi. HTTP 80, HTTPS 443, DNS 53, SSH 22, Winbox 8291.</li></ul><h3>Model OSI singkat</h3><p>7 Application, 6 Presentation, 5 Session, 4 Transport (TCP/UDP), 3 Network (IP, <b>router bekerja di sini</b>), 2 Data Link (MAC, switch), 1 Physical (kabel). Router meneruskan paket antar jaringan berdasarkan IP address.</p>`},
{t:"Mengenal MikroTik & RouterOS",h:`<p><b>MikroTik</b> adalah perusahaan asal Latvia yang membuat perangkat keras <b>RouterBOARD</b> dan sistem operasi <b>RouterOS</b>. RouterOS berbasis Linux dan dapat dipasang di RouterBOARD, PC biasa, maupun mesin virtual (<b>CHR</b> - Cloud Hosted Router).</p><h3>Fitur utama</h3><ul><li>Routing (statis &amp; dinamis: RIP, OSPF, BGP)</li><li>Firewall, NAT, dan mangle</li><li>DHCP, DNS, dan Hotspot</li><li>Bandwidth management (Simple Queue, Queue Tree)</li><li>VPN (PPTP, L2TP, OpenVPN, WireGuard)</li><li>Wireless AP dan monitoring (Torch, Graphing)</li></ul><h3>Level lisensi</h3><div style='overflow-x:auto'><table class='tb2'><tr><th>Level</th><th>Keterangan</th></tr><tr><td>0</td><td>Demo, trial 24 jam</td></tr><tr><td>3</td><td>Perangkat RouterBOARD sederhana</td></tr><tr><td>4</td><td>Fitur lengkap, umum di RouterBOARD</td></tr><tr><td>5-6</td><td>Untuk beban besar (banyak tunnel/user)</td></tr></table></div>`},
{t:"Cara Mengakses Router",h:`<ul><li><b>Winbox:</b> aplikasi GUI Windows (port 8291). Bisa konek via IP atau MAC address, cocok saat router baru atau belum ber-IP.</li><li><b>WebFig:</b> akses lewat browser ke <code>http://IP-router</code>.</li><li><b>CLI:</b> lewat Terminal Winbox, SSH, Telnet, atau kabel serial/console.</li></ul><h3>Default pabrik</h3><ul><li>IP <code>192.168.88.1</code> (di ether2 sampai seterusnya, tergantung model)</li><li>User <code>admin</code>, password kosong</li></ul><h3>Reset konfigurasi</h3><p>Lewat menu <b>System ▸ Reset Configuration</b>, atau tombol fisik Reset di RouterBOARD saat dinyalakan. Gunakan opsi <i>No Default Configuration</i> untuk router kosong.</p>`},
{t:"Interface & Port",h:`<p>Interface adalah titik koneksi router. Jenisnya: <b>ether</b> (kabel LAN), <b>wlan</b> (Wi-Fi), <b>bridge</b> (menyatukan beberapa port jadi satu segmen), <b>vlan</b>, dan <b>pppoe/ovpn</b> (tunnel).</p><h3>Flag status</h3><ul><li><b>R</b> = Running (link aktif)</li><li><b>X</b> = Disabled</li><li><b>S</b> = Slave (menjadi anggota bridge/bonding)</li></ul><h3>Praktik baik</h3><ul><li>Gunakan <b>ether1 = WAN</b>, port lain = LAN.</li><li>Beri <i>comment</i> atau ganti nama interface agar jelas.</li><li>Nonaktifkan port yang tidak dipakai.</li></ul>`},
{t:"IP Address & Subnetting",h:`<p>IPv4 terdiri dari 32 bit (4 oktet). Notasi CIDR <code>/n</code> menunjukkan jumlah bit network. Jumlah host = <code>2<sup>(32-n)</sup> - 2</code>.</p><div style='overflow-x:auto'><table class='tb2'><tr><th>CIDR</th><th>Subnet Mask</th><th>Host</th></tr><tr><td>/24</td><td>255.255.255.0</td><td>254</td></tr><tr><td>/25</td><td>255.255.255.128</td><td>126</td></tr><tr><td>/26</td><td>255.255.255.192</td><td>62</td></tr><tr><td>/27</td><td>255.255.255.224</td><td>30</td></tr><tr><td>/28</td><td>255.255.255.240</td><td>14</td></tr><tr><td>/30</td><td>255.255.255.252</td><td>2</td></tr></table></div><h3>IP Private</h3><ul><li><code>10.0.0.0/8</code></li><li><code>172.16.0.0/12</code></li><li><code>192.168.0.0/16</code></li></ul><p>Contoh <code>192.168.10.1/24</code>: network <code>192.168.10.0</code>, broadcast <code>192.168.10.255</code>, host <code>.1</code> sampai <code>.254</code>.</p><pre>/ip address add address=192.168.10.1/24 interface=ether2</pre>`},
{t:"Routing",h:`<p><b>Routing</b> adalah proses router menentukan jalur paket ke tujuan. Tabel routing ada di <b>IP ▸ Routes</b>.</p><ul><li><b>Connected route:</b> otomatis dibuat saat IP address dipasang pada interface.</li><li><b>Static route:</b> dibuat manual oleh admin.</li><li><b>Default route</b> <code>0.0.0.0/0</code>: jalur untuk semua tujuan yang tidak dikenal, biasanya ke ISP.</li><li><b>Dynamic routing:</b> RIP, OSPF, BGP untuk jaringan besar.</li></ul><p>Router memilih route dengan prefix paling spesifik (longest match). Jika sama, dipilih <b>distance</b> terkecil.</p><pre>/ip route add dst-address=0.0.0.0/0 gateway=192.168.100.1
/ip route add dst-address=172.16.0.0/16 gateway=192.168.10.254</pre><p>Gateway harus berada satu subnet dengan salah satu interface router.</p>`},
{t:"NAT (Network Address Translation)",h:`<p>NAT mengubah alamat IP pada paket. Ada dua chain utama:</p><ul><li><b>srcnat:</b> mengubah alamat sumber (paket keluar). Aksi: <code>masquerade</code> (IP WAN dinamis) atau <code>src-nat</code> (IP tetap).</li><li><b>dstnat:</b> mengubah alamat tujuan (paket masuk), dipakai untuk <i>port forwarding</i>.</li></ul><pre>/ip firewall nat add chain=srcnat out-interface=ether1 action=masquerade
/ip firewall nat add chain=dstnat in-interface=ether1 protocol=tcp dst-port=8080 action=dst-nat to-addresses=192.168.10.20 to-ports=80</pre><p>Tanpa masquerade, IP private LAN tidak dapat kembali dari internet sehingga klien tidak bisa browsing.</p>`},
{t:"DNS dan DHCP",h:`<h3>DNS</h3><p>Menerjemahkan nama domain ke IP. Atur server DNS di <b>IP ▸ DNS</b> dan aktifkan <code>allow-remote-requests</code> agar router menjadi DNS cache untuk klien.</p><pre>/ip dns set servers=8.8.8.8,1.1.1.1 allow-remote-requests=yes</pre><h3>DHCP</h3><p>Memberi konfigurasi IP otomatis ke klien: IP, subnet, gateway, dan DNS. Proses DORA: <b>D</b>iscover, <b>O</b>ffer, <b>R</b>equest, <b>A</b>cknowledge.</p><pre>/ip pool add name=pool1 ranges=192.168.10.10-192.168.10.100
/ip dhcp-server network add address=192.168.10.0/24 gateway=192.168.10.1 dns-server=192.168.10.1
/ip dhcp-server add name=dhcp1 interface=ether2 address-pool=pool1 disabled=no</pre><p>Gunakan <b>Static Lease</b> untuk mengikat IP tertentu ke MAC address perangkat (misal printer).</p>`},
{t:"Firewall Dasar",h:`<p>Firewall memfilter lalu lintas. Rule dibaca <b>dari atas ke bawah</b>, rule pertama yang cocok yang dijalankan.</p><ul><li><b>input:</b> menuju router itu sendiri</li><li><b>forward:</b> melewati router (LAN ke internet)</li><li><b>output:</b> berasal dari router</li></ul><h3>Contoh pengamanan dasar</h3><pre>/ip firewall filter add chain=input connection-state=established,related action=accept
/ip firewall filter add chain=input connection-state=invalid action=drop
/ip firewall filter add chain=input in-interface=ether1 protocol=icmp action=accept
/ip firewall filter add chain=input in-interface=ether1 action=drop</pre><p>Rule terakhir memblokir semua akses dari WAN ke router, kecuali yang sudah diizinkan di atasnya.</p>`},
{t:"Keamanan & Maintenance",h:`<ul><li><b>Ganti password admin</b> atau buat user baru (System ▸ Users).</li><li><b>Matikan service tak terpakai</b> di IP ▸ Services (telnet, ftp, api).</li><li><b>Backup:</b> <code>/system backup save name=awal</code> (file .backup, untuk router yang sama). <b>Export:</b> <code>/export file=config</code> (teks, bisa dibaca &amp; dipindah).</li><li><b>Update RouterOS</b> via System ▸ Packages / Check For Updates.</li><li><b>Identity:</b> beri nama router di System ▸ Identity.</li><li><b>NTP/Clock</b> diatur agar log waktu akurat.</li></ul>`},
{t:"Cheat Sheet & Troubleshooting",h:`<h3>Perintah CLI penting</h3><pre>/interface print
/ip address print
/ip route print
/ip firewall nat print
/ip dhcp-server lease print
/ping 8.8.8.8
/tool traceroute 8.8.8.8
/tool torch interface=ether2</pre><h3>Urutan troubleshooting</h3><ul><li>1. Kabel &amp; status interface (flag R?)</li><li>2. IP address &amp; subnet benar?</li><li>3. Ping gateway ISP dari router</li><li>4. Default route sudah ada?</li><li>5. NAT masquerade sudah dibuat?</li><li>6. Ping IP (8.8.8.8) berhasil tapi domain gagal? Periksa DNS</li><li>7. Cek firewall yang memblokir</li></ul>`}];
